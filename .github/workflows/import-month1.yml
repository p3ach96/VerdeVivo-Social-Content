name: Import approved Month 1 editorial content

on:
  push:
    paths:
      - ".github/workflows/import-month1.yml"

permissions:
  contents: write

concurrency:
  group: verdevivo-month1-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate approved content
        shell: bash
        env:
          U01: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IKUgIPJVJaS3AlVNLw6EYWWGJC/20f7961b-965d-47a6-90d9-23619d34d405.png"
          U02: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IKUgIPJVJaS3AlVNLw6EYWWGJC/6b3bec53-53fe-44fc-b953-9ffd0adba5e5.png"
          U03: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IKUgIPJVJaS3AlVNLw6EYWWGJC/972fcfb7-aa41-48da-99e3-8f5db22dc89d.png"
          U04: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IKUgIPJVJaS3AlVNLw6EYWWGJC/a9aefffd-07aa-47ce-a261-530c302c6b84.png"
          U05: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IKUgIPJVJaS3AlVNLw6EYWWGJC/6a76a9b0-bc48-4d43-8650-697eaa825349.png"
          U06: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IKUgIPJVJaS3AlVNLw6EYWWGJC/09213faf-4e7c-495d-b57f-9f81c6853ed6.png"
          U07: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IKUgIPJVJaS3AlVNLw6EYWWGJC/9a131778-6bee-4cac-812a-7ee2618ccb73.png"
          U08: "https://d2ol7oe51mr4n9.cloudfront.net/user_3IKUgIPJVJaS3AlVNLw6EYWWGJC/9322f6fc-b824-4bf6-bba9-86eb55505130.png"
        run: |
          set -euo pipefail

          if find content -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "Content directory is not empty; refusing import."
            exit 1
          fi

          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          posts = [
            {
              "id": "2026-09-29-your-plant-is-talking",
              "publishAt": "2026-09-29T18:00:00+02:00",
              "altText": "Premium VerdeVivo graphic showing a glossy green houseplant leaf with a slightly browned, yellowing tip in warm natural light. Text reads “Your plant is talking” and “Small changes can tell you a lot — if you learn to notice them.”",
              "caption": "Your plant is talking. Small changes can reveal a lot when you learn to notice them.",
              "hashtags": ["PlantCare","Houseplants","PlantTips","VerdeVivo"]
            },
            {
              "id": "2026-10-02-water-the-plant-not-the-calendar",
              "publishAt": "2026-10-02T18:00:00+02:00",
              "altText": "VerdeVivo graphic of a hand gently pressing a finger into potting soil beside a healthy variegated houseplant in warm sunlight. Text reads “Water the plant, not the calendar” and “Check first. Water second.”",
              "caption": "Water the plant, not the calendar. Check the soil first, then decide whether it needs water.",
              "hashtags": ["PlantCare","Houseplants","WateringTips","VerdeVivo"]
            },
            {
              "id": "2026-10-06-growth-happens-quietly",
              "publishAt": "2026-10-06T18:00:00+02:00",
              "altText": "VerdeVivo graphic of a fresh light-green leaf slowly unfurling among mature leaves in soft morning light. Text reads “Growth happens quietly” and “Then one day, you notice.”",
              "caption": "Growth happens quietly. A new leaf, a longer stem, stronger roots — then one day, you notice.",
              "hashtags": ["PlantLove","Houseplants","PlantGrowth","VerdeVivo"]
            },
            {
              "id": "2026-10-09-one-photo-today-story-tomorrow",
              "publishAt": "2026-10-09T18:00:00+02:00",
              "altText": "VerdeVivo graphic with three instant-photo style images of the same potted plant at Day 1, Day 60 and Day 180, showing its growth over time. Text reads “One photo today. A story tomorrow.”",
              "caption": "One photo today. A story tomorrow. Keep the moments that show how your plant has grown.",
              "hashtags": ["PlantJournal","Houseplants","PlantGrowth","VerdeVivo"]
            },
            {
              "id": "2026-10-13-yellow-leaf-clue",
              "publishAt": "2026-10-13T18:00:00+02:00",
              "altText": "VerdeVivo graphic showing a healthy variegated houseplant with one prominent yellow leaf in warm sunlight. Text reads “A yellow leaf is a clue, not a diagnosis” and “Look for patterns, not panic.”",
              "caption": "A yellow leaf is a clue, not a diagnosis. Look for patterns before changing your care routine.",
              "hashtags": ["PlantCare","Houseplants","PlantHealth","VerdeVivo"]
            },
            {
              "id": "2026-10-16-ten-second-plant-check",
              "publishAt": "2026-10-16T18:00:00+02:00",
              "altText": "VerdeVivo graphic showing a hand inspecting a variegated leaf with the plant pot and soil visible. Text reads “The 10-second plant check,” followed by “Leaves. Soil. Growth. Pests.”",
              "caption": "The 10-second plant check: leaves, soil, growth and pests. Small checks prevent big surprises.",
              "hashtags": ["PlantCare","Houseplants","PlantTips","VerdeVivo"]
            },
            {
              "id": "2026-10-20-notice-growth-look-back",
              "publishAt": "2026-10-20T18:00:00+02:00",
              "altText": "VerdeVivo graphic showing a mature variegated plant in the foreground and a softly blurred photo of the same plant when it was smaller. Text reads “You notice growth when you look back.”",
              "caption": "Day to day, growth can feel invisible. Look back months later and the change is suddenly everywhere.",
              "hashtags": ["PlantLove","Houseplants","PlantGrowth","VerdeVivo"]
            },
            {
              "id": "2026-10-23-know-more-than-name",
              "publishAt": "2026-10-23T18:00:00+02:00",
              "altText": "VerdeVivo graphic showing a variegated houseplant surrounded by subtle care-history callouts for watering, repotting, a note, a photo and a milestone. Text reads “Know more than your plant's name.”",
              "caption": "Knowing a plant's name is useful. Knowing its history helps you understand how it changes over time.",
              "hashtags": ["PlantCare","PlantJournal","Houseplants","VerdeVivo"]
            }
          ]

          for i, p in enumerate(posts, 1):
              d = pathlib.Path("content") / p["id"]
              d.mkdir(parents=True, exist_ok=False)
              manifest = {
                  "id": p["id"],
                  "version": 1,
                  "status": "approved",
                  "language": "en",
                  "publishAt": p["publishAt"],
                  "image": "social.png",
                  "altText": p["altText"],
                  "caption": p["caption"],
                  "hashtags": p["hashtags"],
                  "channels": ["bluesky","mastodon","youtube"]
              }
              (d / "manifest.json").write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              req = urllib.request.Request(
                  os.environ[f"U{i:02d}"],
                  headers={"User-Agent": "VerdeVivo-Editorial-Import/1.0"}
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = resp.read()
              (d / "social.png").write_bytes(data)
          PY

          python3 - <<'PY'
          import json, pathlib
          from datetime import datetime

          dirs = sorted(p for p in pathlib.Path("content").iterdir() if p.is_dir())
          assert len(dirs) == 8, len(dirs)
          weeks = {}

          for d in dirs:
              m = json.loads((d / "manifest.json").read_text(encoding="utf-8"))
              assert m["id"] == d.name
              assert m["version"] == 1
              assert m["status"] == "approved"
              assert m["language"] == "en"
              assert m["image"] == "social.png"
              assert m["channels"] == ["bluesky","mastodon","youtube"]
              assert 1 <= len(m["caption"]) <= 100
              assert 1 <= len(m["altText"]) <= 1500
              assert len(m["hashtags"]) <= 20
              img = (d / "social.png").read_bytes()
              assert img[:8] == b"\x89PNG\r\n\x1a\n"
              assert 8 < len(img) <= 12000000

              dt = datetime.fromisoformat(m["publishAt"])
              key = (dt.isocalendar().year, dt.isocalendar().week)
              weeks[key] = weeks.get(key, 0) + 1

          assert all(v <= 2 for v in weeks.values()), weeks
          print("Validated 8 approved posts; weekly cap OK:", weeks)
          PY

          git config user.name "VerdeVivo Editorial Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f content/.gitkeep
          git add content
          git rm .github/workflows/import-month1.yml
          git commit -m "content: schedule VerdeVivo month 1 editorial posts"
          git push origin HEAD:main
