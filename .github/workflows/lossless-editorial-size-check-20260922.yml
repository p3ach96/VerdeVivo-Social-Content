name: Lossless Editorial media verification 20260922
on:
  push:
    branches: [ops/lossless-editorial-size-check-20260922]
    paths: [.github/workflows/lossless-editorial-size-check-20260922.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Lossless size correction and eight-post validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "76df94f5724b8bd502d9f52d807f377c49854b64"
          python3 - <<'PY'
          import struct,zlib,json,hashlib,re
          from pathlib import Path
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          assert datetime.now(timezone.utc)<datetime.fromisoformat('2026-09-22T15:50:00+00:00')
          root=Path('content');ids=json.loads((root/'index.json').read_text())
          assert len(ids)==8 and len(set(ids))==8
          target='2026-10-02-water-the-plant-not-the-calendar'
          p=root/target/'social.png';before=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest()=='b45265dd5879e302a01a900e54174e26eb71f5b6'
          def chunks(b):
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              out=[];i=8
              while i<len(b):
                  assert i+12<=len(b)
                  n=struct.unpack('>I',b[i:i+4])[0];t=b[i+4:i+8];d=b[i+8:i+8+n]
                  assert len(d)==n and i+12+n<=len(b)
                  assert zlib.crc32(t+d)&0xffffffff==struct.unpack('>I',b[i+8+n:i+12+n])[0]
                  out.append((t,d));i+=12+n
              assert i==len(b) and out[-1][0]==b'IEND'
              return out
          original=chunks(before);data=zlib.decompress(b''.join(d for t,d in original if t==b'IDAT'))
          def make(compressed):
              b=before[:8];written=False
              for t,d in original:
                  if t==b'IDAT':
                      if written:continue
                      d=compressed;written=True
                  b+=struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              return b
          options=[]
          for strategy in [zlib.Z_DEFAULT_STRATEGY,zlib.Z_FILTERED]:
              for level in [7,8,9]:
                  c=zlib.compressobj(level,zlib.DEFLATED,15,9,strategy)
                  options.append(make(c.compress(data)+c.flush()))
          after=min(options,key=len);new=chunks(after)
          assert len(after)<=2000000, ('lossless_candidate_still_oversize',len(after))
          assert [(t,d) for t,d in original if t!=b'IDAT']==[(t,d) for t,d in new if t!=b'IDAT']
          decoded=zlib.decompress(b''.join(d for t,d in new if t==b'IDAT'))
          assert decoded==data
          p.write_bytes(after)
          mp=root/target/'manifest.json';m=json.loads(mp.read_text());assert m['version']==1 and m['status']=='approved'
          assert m['publishAt']=='2026-09-25T18:00:00+02:00'
          m['version']=2;mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          rows=[];weeks={}
          for ident in ids:
              assert re.fullmatch('[a-z0-9][a-z0-9-]{0,79}',ident)
              post=json.loads((root/ident/'manifest.json').read_text());b=(root/ident/'social.png').read_bytes();ch=chunks(b)
              assert post['id']==ident and post['status']=='approved' and post['language']=='en'
              assert set(post['channels'])=={'bluesky','mastodon','youtube'} and post['image']=='social.png'
              assert 0<len(b)<=2000000
              w,h=struct.unpack('>II',ch[0][1][:8]);assert 0<w<=4000 and 0<h<=4000
              text=post['caption']+'\n\n'+' '.join('#'+s for s in post['hashtags'])
              assert len(text)<=300 and 0<len(post['altText'])<=1500
              at=datetime.fromisoformat(post['publishAt']).astimezone(ZoneInfo('Europe/Rome'))
              assert at.hour==18 and at.minute==0 and at.weekday() in (1,4)
              week=str(at.isocalendar()[:2]);weeks[week]=weeks.get(week,0)+1
              rows.append({'id':ident,'version':post['version'],'publishAt':post['publishAt'],'bytes':len(b),'width':w,'height':h,'sha256':hashlib.sha256(b).hexdigest(),'captionCodePointsWithHashtags':len(text),'withinBlueskyByteLimit':True})
          assert len(weeks)==4 and set(weeks.values())=={2}
          proof={'checkedAt':datetime.now(timezone.utc).isoformat(),'kind':'lossless_encoded_byte_correction_only','content':target,'beforeBytes':len(before),'afterBytes':len(after),'beforePixelStreamSha256':hashlib.sha256(data).hexdigest(),'afterPixelStreamSha256':hashlib.sha256(decoded).hexdigest(),'pixelStreamIdentical':True,'nonIdatChunksIdentical':True,'manifestVersion':2,'captionsAndDatesUnchanged':True,'allEightFilesWithinProviderSizeLimit':True,'posts':rows}
          Path('ops').mkdir(exist_ok=True);Path('ops/editorial-media-validation-20260922.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps({k:v for k,v in proof.items() if k!='posts'}))
          PY
          git diff --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "76df94f5724b8bd502d9f52d807f377c49854b64"
          git config user.name "VerdeVivo Operations"
          git config user.email "actions@users.noreply.github.com"
          git add content/2026-10-02-water-the-plant-not-the-calendar/social.png content/2026-10-02-water-the-plant-not-the-calendar/manifest.json ops/editorial-media-validation-20260922.json
          git commit -m "Keep approved Editorial PNG within Bluesky limit without pixel changes"
          git push origin HEAD:main
